# ProGuideGH — local development dependencies (spec §6.1).
# PostgreSQL is the system of record; Redis holds ephemeral state only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proguidegh
      POSTGRES_PASSWORD: proguidegh
      POSTGRES_DB: proguidegh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proguidegh -d proguidegh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
